# InteractFormer Model Configuration
# =====================================
# Configuration for the Interaction Model (S1) and Background Model (S2).

model:
  interaction:
    hidden_size: 2048
    num_layers: 24
    num_attention_heads: 16
    num_kv_heads: 4
    intermediate_size: 5632
    micro_turn_ms: 200
    audio_sample_rate: 24000
    audio_encoder_type: dmel          # "dmel" (TML-style) or "whisper"
    vision_patch_size: 40
    num_experts: 8
    num_experts_per_tok: 2

  background:
    model_type: llm
    model_name_or_path: Qwen/Qwen3-Omni-30B-A3B-Instruct
    max_context_length: 32768
    ensemble_mode: parallel            # "parallel", "cascade", "voting"
    reasoning_depth: adaptive          # "shallow", "deep", "adaptive"
    tool_use_enabled: true
    retrieval_enabled: true
    retrieval_top_k: 5
    stream_chunk_size: 200

  bridge:
    fusion_mode: cross_attention      # "cross_attention", "gate", "concat"
    injection_strategy: adaptive      # "eager", "scheduled", "adaptive"
    max_pending_chunks: 8
    context_compression_ratio: 0.5
    time_alignment: true
