# TML-style reproduction plan using DuplexOmni as the bootstrap checkpoint.
# This file is intentionally separate from model_config.yaml: the first phase
# runs DuplexOmni through its own runtime instead of loading its tensors into
# InteractFormer's custom nn.Module classes.

reproduction:
  target: tml_interaction_model
  micro_turn_ms: 200
  strategy: external_backbone_then_distill

  source:
    model_name_or_path: MuyeHuang/DuplexOmni
    architecture: Qwen3OmniMoeForConditionalGeneration
    runtime: duplexomni_modified_vllm
    revision: main                 # pin a commit hash for real training
    trust_remote_code: false
    expected_dtype: bfloat16

  reuse:
    complete_checkpoint_as_external_s1: true
    tokenizer_and_special_tokens: true
    direct_load_into_interactformer: false
    selective_embedding_transplant: experimental
    use_as_distillation_teacher: true

  student:
    hidden_size: 2048
    num_layers: 24
    num_attention_heads: 16
    num_kv_heads: 4
    num_experts: 8
    num_experts_per_tok: 2
    audio_frontend: dmel
    vision_patch_size: 40
    audio_output: flow_head

  curriculum:
    - phase: runtime_baseline
      trainable: none
      objective: Run the complete DuplexOmni checkpoint and record latency/quality baselines.
    - phase: interaction_sft
      trainable: duplex_lora
      objective: Train silence, overlap, interruption, backchannel, and visual-proactivity behavior on time-aligned sessions.
    - phase: background_coordination
      trainable: duplex_lora_and_bridge
      objective: Train delegation and asynchronous result reintegration using full context packages.
    - phase: tml_student_distillation
      trainable: interactformer_student
      objective: Distill Duplex semantic/codec targets into the dMel + 40x40 + flow-head student.
    - phase: preference_and_safety
      trainable: student_policy
      objective: Optimize timing, natural refusals, long-session robustness, and tool safety.

  evaluation:
    interaction:
      - fd_bench
      - interruption_latency
      - backchannel_precision
      - overlap_recovery
    temporal:
      - timespeak
      - cuespeak
    visual:
      - repcount_a_streaming
      - proactive_video_qa
      - charades_temporal_iou
    systems:
      - first_packet_latency
      - p95_micro_turn_latency
      - kv_cache_growth
      - dropped_audio_chunks

