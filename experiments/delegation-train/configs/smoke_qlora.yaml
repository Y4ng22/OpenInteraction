### Smoke test: QLoRA (4-bit language model) with plain data parallel, 20 steps on 10 samples. Paths are filled in by run_smoke.sh.
model_name_or_path: __MODEL__
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
quantization_bit: 4
quantization_method: bnb
flash_attn: sdpa

dataset: smoke
dataset_dir: __DATA__
template: funaudiochat
cutoff_len: 3072
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: __OUT__/qlora
logging_steps: 1
save_strategy: "no"
overwrite_output_dir: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 1
max_steps: 20
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
report_to: none
logging_nan_inf_filter: false
ddp_timeout: 180000000
